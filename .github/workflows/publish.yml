name: Publish atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional: reviewed community issue number to approve and publish'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Restore confirmed missing photo links once
        run: node scripts/restore-photo-links.mjs
      - name: Import explicitly approved issue
        if: github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/community-import.mjs
      - name: Validate atlas before publishing
        run: node --test tests/*.test.mjs
      - name: Commit approved community data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/community.json data/details.json data/photo-recoveries-applied.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reviewed atlas contribution'
            git push origin HEAD:main
          fi
      - name: Stamp published update date
        run: node scripts/stamp-deployment.mjs
      - name: Package Pages artifact
        run: tar --dereference --hard-dereference --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
