name: Publish atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional: reviewed community issue number to approve and publish'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Import explicitly approved issue
        if: github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/community-import.mjs
      - name: Validate atlas before publishing
        run: node --test tests/*.test.mjs
      - name: Commit approved community data
        if: github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/community.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reviewed atlas contribution'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
