name: Atlas Source Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check sources and document gaps
        run: node scripts/atlas-source-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-source-review
          path: review-output/
