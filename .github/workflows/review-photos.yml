name: Review and publish photos
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Photo submission issue number'
        required: true
        type: string
      publish:
        description: 'Publish after reviewing the preview and exact issue body'
        type: boolean
        default: false
      review_hash:
        description: 'SHA-256 from the preview run (required to publish)'
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-publish
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    environment: github-pages
    permissions:
      contents: write
      issues: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Restore confirmed missing photo links once
        run: node scripts/restore-photo-links.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install image decoder
        if: inputs.publish
        run: python -m pip install 'Pillow>=12,<13'
      - name: Verify moderator and review exact submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PUBLISH: ${{ inputs.publish }}
          REVIEW_HASH: ${{ inputs.review_hash }}
        run: node scripts/photo-review.mjs
      - name: Test publication
        if: inputs.publish
        run: node --test tests/*.test.mjs
      - name: Commit approved photos and notes
        if: inputs.publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos/community data/details.json data/community.json data/photo-recoveries-applied.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish moderator-reviewed photo submission'
            git push origin HEAD:main
          fi
      - name: Stamp published update date
        if: inputs.publish
        run: node scripts/stamp-deployment.mjs
      - name: Package Pages artifact
        if: inputs.publish
        run: tar --dereference --hard-dereference --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v6
        if: inputs.publish
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/deploy-pages@v5
        if: inputs.publish
